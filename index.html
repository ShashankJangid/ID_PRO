<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Gen — ID Card Studio</title>
  <meta name="description" content="Professional ID card generator. Design, import data, and export high-quality ID cards in seconds." />

  <!-- DNS prefetch for Firebase -->
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

  <!-- Google Fonts: preconnect first, then load async -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"></noscript>

  <!-- Instant splash screen — pure CSS, zero JS needed -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #060b14; }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #060b14;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; }

    .splash-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4165b4, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(65, 101, 180, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }
    .splash-logo svg { width: 36px; height: 36px; }

    .splash-name {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .splash-name span { color: #4165b4; }

    .splash-bar {
      width: 160px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .splash-bar-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #4165b4, #7c3aed);
      border-radius: 999px;
      animation: loading-bar 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(65,101,180,0.4); transform: scale(1); }
      50% { box-shadow: 0 0 60px rgba(65,101,180,0.7); transform: scale(1.04); }
    }
    @keyframes loading-bar {
      0%   { transform: translateX(-100%); width: 40%; }
      50%  { width: 60%; }
      100% { transform: translateX(300%); width: 40%; }
    }

    #root { height: 100%; }
  </style>
</head>

<body>
  <!-- Splash shown instantly before any JS loads -->
  <div id="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="7" width="28" height="22" rx="3.5" fill="white" opacity="0.95"/>
        <rect x="4" y="7" width="28" height="7" rx="3.5" fill="url(#g1)"/>
        <rect x="4" y="10" width="28" height="4" fill="url(#g1)"/>
        <circle cx="12" cy="20" r="3.5" fill="#cbd5e1"/>
        <rect x="17" y="17" width="10" height="2" rx="1" fill="#94a3b8"/>
        <rect x="17" y="21" width="7" height="1.5" rx="0.75" fill="#cbd5e1"/>
        <defs>
          <linearGradient id="g1" x1="4" y1="7" x2="32" y2="7" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4165b4"/>
            <stop offset="1" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="splash-name">Card<span>Gen</span></div>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

  <!-- Hide splash once React mounts -->
  <script>
    window.__hideSplash = function() {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 500); }
    };
  </script>
</body>

</html>
